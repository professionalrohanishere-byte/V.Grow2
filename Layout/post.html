---
layout: default
---
<article class="narrow" style="padding: 56px 24px 80px;">
  <span class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</span>
  <h1 style="font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 0.6em;">{{ page.title }}</h1>
  <div class="about-body">
    {{ content }}
  </div>
  <p style="margin-top:48px;"><a href="{{ '/' | relative_url }}" class="btn btn-outline">&larr; Back to all articles</a></p>
</article>
